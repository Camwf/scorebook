<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fremantle Casual Cricket League Scorebook</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            carlson: {
              maroon: '#8b1528',
              mustard: '#fdc329',
              blue: '#8bbdcb',
              beige: '#e3ded1',
              charcoal: '#1c1c1c',
              gray1: '#3d3d3d',
              gray2: '#5c5c5c',
              gray3: '#b3b3b3',
              red: '#e63946',
              pink: '#ff7eb3'
            }
          }
        }
      }
    }
  </script>

  <style>
    body { background-color: #e3ded1; color: #1c1c1c; font-family: ui-sans-serif, system-ui, sans-serif; touch-action: manipulation; }
    .shadow-3d { box-shadow: 0 4px 0 #1c1c1c; transition: all 0.1s; border: 2px solid #1c1c1c; }
    .shadow-3d:active { transform: translateY(4px); box-shadow: 0 0px 0 #1c1c1c; }
    .drag-handle { cursor: grab; }
    .drag-handle:active { cursor: grabbing; }
  </style>
</head>
<body class="min-h-screen p-2 md:p-4 flex flex-col items-center">

  <div id="app-container" class="w-full max-w-md flex flex-col gap-4 pb-20">
    
    <!-- 1. OVERVIEW SECTION -->
    <div class="bg-white rounded-xl p-4 shadow-3d relative" data-id="overview">
      <div class="drag-handle absolute top-2 right-2 text-carlson-gray3 p-2">⋮⋮</div>
      <div class="flex justify-between items-center mb-2 pr-6">
        <input type="text" id="batting-team" class="font-bold text-lg bg-transparent border-b border-dashed border-carlson-gray3 w-1/2" value="Swan Draught Dodgers">
        <span class="text-sm font-bold text-carlson-gray2">v</span>
        <input type="text" id="bowling-team" class="font-bold text-lg bg-transparent border-b border-dashed border-carlson-gray3 w-1/2 text-right" value="Western Weekend Warriors">
      </div>
      <div class="flex justify-between items-end">
        <div>
          <div class="text-5xl font-black text-carlson-maroon tracking-tighter" id="main-score">0<span class="text-3xl text-carlson-charcoal">/0</span></div>
          <div class="text-sm font-bold text-carlson-gray2 mt-1">Overs: <span id="main-overs" class="text-carlson-charcoal">0.0</span></div>
          <div id="target-display" class="text-sm font-bold text-carlson-maroon mt-1 hidden">Target: <span id="main-target">0</span></div>
        </div>
        <button onclick="toggleScorecard()" class="bg-carlson-blue text-carlson-charcoal font-bold px-4 py-2 rounded shadow-3d text-sm">📊 Scorecard</button>
      </div>
    </div>

    <!-- 2. PITCH SECTION -->
    <div class="bg-white rounded-xl p-4 shadow-3d relative" data-id="pitch">
      <div class="drag-handle absolute top-2 right-2 text-carlson-gray3 p-2">⋮⋮</div>
      <h3 class="font-black text-carlson-charcoal mb-3 uppercase tracking-wide border-b-2 border-carlson-charcoal inline-block">The Pitch</h3>
      
      <div class="grid grid-cols-[1fr_auto_1fr] gap-2 items-center mb-4">
        <!-- Striker -->
        <div id="striker-card" class="border-4 border-carlson-mustard rounded-lg p-2 bg-white relative">
          <div class="absolute -top-3 left-2 bg-carlson-mustard text-carlson-charcoal text-xs font-black px-2 py-0.5 rounded border-2 border-carlson-charcoal">🏏 FACING</div>
          <input type="text" id="striker-name" class="font-bold w-full bg-transparent mt-2 truncate" value="" placeholder="Batter 1">
          <div class="text-sm font-bold mt-1 text-carlson-gray2"><span id="striker-runs">0</span> (<span id="striker-balls">0</span>)</div>
        </div>
        
        <!-- Swap Button -->
        <button onclick="swapBatters()" class="bg-white border-2 border-carlson-blue rounded-full w-10 h-10 flex items-center justify-center shadow-3d -mt-2">
          🔄
        </button>

        <!-- Non-Striker -->
        <div id="nonstriker-card" class="border-2 border-carlson-gray3 rounded-lg p-2 bg-carlson-beige opacity-80">
          <input type="text" id="nonstriker-name" class="font-bold w-full bg-transparent mt-2 truncate" value="" placeholder="Batter 2">
          <div class="text-sm font-bold mt-1 text-carlson-gray2"><span id="nonstriker-runs">0</span> (<span id="nonstriker-balls">0</span>)</div>
        </div>
      </div>

      <!-- Bowler -->
      <div class="border-2 border-carlson-maroon rounded-lg p-2 bg-white flex justify-between items-center">
        <div class="w-2/3">
          <div class="text-xs font-black text-carlson-maroon uppercase mb-1">Current Bowler 🔴</div>
          <input type="text" id="bowler-name" class="font-bold w-full bg-transparent truncate" value="" placeholder="Bowler">
        </div>
        <div class="text-right">
          <div class="text-sm font-bold text-carlson-gray2"><span id="bowler-overs">0.0</span> O</div>
          <div class="text-sm font-bold text-carlson-charcoal"><span id="bowler-runs">0</span> / <span id="bowler-wickets">0</span></div>
        </div>
      </div>
    </div>

    <!-- 3. SCORE SECTION -->
    <div class="bg-white rounded-xl p-4 shadow-3d relative" data-id="score">
      <div class="drag-handle absolute top-2 right-2 text-carlson-gray3 p-2">⋮⋮</div>
      <h3 class="font-black text-carlson-charcoal mb-3 uppercase tracking-wide border-b-2 border-carlson-charcoal inline-block">Score Input</h3>
      
      <div class="grid grid-cols-4 gap-2 mb-2">
        <button onclick="addRun(0)" class="bg-carlson-beige font-black py-4 rounded shadow-3d text-lg">0</button>
        <button onclick="addRun(1)" class="bg-carlson-beige font-black py-4 rounded shadow-3d text-lg">1</button>
        <button onclick="addRun(2)" class="bg-carlson-beige font-black py-4 rounded shadow-3d text-lg">2</button>
        <button onclick="addRun(3)" class="bg-carlson-beige font-black py-4 rounded shadow-3d text-lg">3</button>
        <button onclick="addRun(4)" class="bg-carlson-mustard font-black py-4 rounded shadow-3d text-lg">4</button>
        <button onclick="addRun(5)" class="bg-carlson-beige font-black py-4 rounded shadow-3d text-lg">5</button>
        <button onclick="addRun(6)" class="bg-carlson-mustard font-black py-4 rounded shadow-3d text-lg">6</button>
        <button onclick="promptCustomRun()" class="bg-carlson-gray3 text-white font-black py-4 rounded shadow-3d text-sm leading-tight">CUST<br>#</button>
      </div>
      <div class="grid grid-cols-4 gap-2 mb-4">
        <button onclick="addExtra('wd')" class="bg-carlson-gray2 text-white font-black py-3 rounded shadow-3d">WD</button>
        <button onclick="addExtra('nb')" class="bg-carlson-gray2 text-white font-black py-3 rounded shadow-3d">NB</button>
        <button onclick="addExtra('b')" class="bg-carlson-gray2 text-white font-black py-3 rounded shadow-3d">B</button>
        <button onclick="addExtra('lb')" class="bg-carlson-gray2 text-white font-black py-3 rounded shadow-3d">LB</button>
      </div>
      
      <div class="grid grid-cols-2 gap-2">
        <button onclick="undoLast()" class="bg-white border-2 border-carlson-pink text-carlson-charcoal font-black py-4 rounded shadow-3d uppercase">Rewind ↺</button>
        <button onclick="triggerWicket()" class="bg-carlson-red text-white font-black py-4 rounded shadow-3d uppercase">Wicket / Out</button>
      </div>
    </div>

    <!-- 4. TEAMS & ROSTERS SECTION -->
    <div class="bg-white rounded-xl p-4 shadow-3d relative" data-id="teams">
      <div class="drag-handle absolute top-2 right-2 text-carlson-gray3 p-2">⋮⋮</div>
      <h3 class="font-black text-carlson-charcoal mb-3 uppercase tracking-wide border-b-2 border-carlson-charcoal inline-block">Team Rosters</h3>
      
      <div class="grid grid-cols-2 gap-4 mb-4">
        <!-- Batting Roster -->
        <div>
          <div class="font-bold text-sm text-carlson-mustard bg-carlson-charcoal px-2 py-1 rounded-t">🏏 Batting</div>
          <div id="batting-roster-list" class="text-sm border-x border-b border-carlson-gray3 p-2 h-32 overflow-y-auto bg-carlson-beige rounded-b flex flex-col gap-1"></div>
          <button onclick="addManualPlayer('bat')" class="mt-2 text-xs font-bold text-carlson-blue underline uppercase">+ Add Batter</button>
        </div>
        <!-- Bowling Roster -->
        <div>
          <div class="font-bold text-sm text-white bg-carlson-maroon px-2 py-1 rounded-t">🔴 Bowling</div>
          <div id="bowling-roster-list" class="text-sm border-x border-b border-carlson-gray3 p-2 h-32 overflow-y-auto bg-carlson-beige rounded-b flex flex-col gap-1"></div>
          <button onclick="addManualPlayer('bowl')" class="mt-2 text-xs font-bold text-carlson-maroon underline uppercase">+ Add Bowler</button>
        </div>
      </div>
      
      <div class="grid grid-cols-2 gap-2">
        <button onclick="endInnings()" class="bg-carlson-charcoal text-carlson-mustard font-black py-4 rounded shadow-3d uppercase tracking-wider text-xs">Swap Innings</button>
        <button onclick="archiveAndReset()" class="bg-carlson-gray2 text-white font-black py-4 rounded shadow-3d uppercase tracking-wider text-xs">Reset Game</button>
      </div>
    </div>

  </div>

  <script>
    // ==========================================
    // 1. FIREBASE CONFIGURATION
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyDphppctjnw0X-e6dR_c6lQXsQ469SRQf4",
      authDomain: "scorebookcam.firebaseapp.com",
      databaseURL: "https://scorebookcam-default-rtdb.firebaseio.com",
      projectId: "scorebookcam",
      storageBucket: "scorebookcam.firebasestorage.app",
      messagingSenderId: "868566468125",
      appId: "1:868566468125:web:459eb6500867308b2268f4",
      measurementId: "G-53HEZ6PJ4Y"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const matchRef = db.ref('currentMatch');

    // ==========================================
    // 2. STATE MANAGEMENT
    // ==========================================
    let state = {
      score: 0, wickets: 0, balls: 0, target: 0,
      battingTeamName: "Swan Draught Dodgers",
      bowlingTeamName: "Western Weekend Warriors",
      striker: { name: "", runs: 0, balls: 0 },
      nonStriker: { name: "", runs: 0, balls: 0 },
      bowler: { name: "", runs: 0, wickets: 0, balls: 0 },
      battingRoster: [],
      bowlingRoster: [],
      history: []
    };

    let isUpdatingFromFirebase = false;

    matchRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        isUpdatingFromFirebase = true;
        state = { ...state, ...data }; 
        if (!state.battingRoster) state.battingRoster = [];
        if (!state.bowlingRoster) state.bowlingRoster = [];
        renderUI();
        isUpdatingFromFirebase = false;
      } else {
        // Database is completely empty, prompt the user instantly
        promptInitialSetup();
      }
    });

    function saveState() {
      if (!isUpdatingFromFirebase) {
        matchRef.set(state).catch(error => console.error("Firebase error:", error));
      }
    }

    function snapshotHistory() {
      const stateCopy = JSON.parse(JSON.stringify(state));
      delete stateCopy.history;
      state.history.push(stateCopy);
      if (state.history.length > 10) state.history.shift(); 
    }

    function promptInitialSetup() {
      const b1 = prompt("Welcome to a New Match!\n\nEnter Opening Batter 1:") || "Batter 1";
      const b2 = prompt("Enter Opening Batter 2:") || "Batter 2";
      const bw = prompt("Enter Opening Bowler:") || "Bowler 1";
      
      state.striker = { name: b1, runs: 0, balls: 0 };
      state.nonStriker = { name: b2, runs: 0, balls: 0 };
      state.bowler = { name: bw, runs: 0, wickets: 0, balls: 0 };
      
      state.battingRoster = [b1, b2];
      state.bowlingRoster = [bw];
      
      saveState();
      renderUI();
    }

    // ==========================================
    // 3. CORE CRICKET LOGIC
    // ==========================================
    function addRun(runs) {
      snapshotHistory();
      state.score += runs;
      state.balls += 1;
      state.striker.runs += runs;
      state.striker.balls += 1;
      state.bowler.runs += runs;
      state.bowler.balls += 1;
      
      if (runs % 2 !== 0) swapLogic();
      checkOver();
      saveState();
      renderUI();
    }

    function addExtra(type) {
      snapshotHistory();
      state.score += 1; 
      state.bowler.runs += 1;
      
      if (type !== 'wd' && type !== 'nb') {
        state.balls += 1;
        state.striker.balls += 1;
        state.bowler.balls += 1;
      }
      checkOver();
      saveState();
      renderUI();
    }

    function swapLogic() {
      const temp = state.striker;
      state.striker = state.nonStriker;
      state.nonStriker = temp;
    }

    function swapBatters() {
      snapshotHistory();
      swapLogic();
      saveState();
      renderUI();
    }

    function triggerWicket() {
      snapshotHistory();
      state.wickets += 1;
      state.balls += 1;
      state.striker.balls += 1;
      state.bowler.wickets += 1;
      state.bowler.balls += 1;
      
      const newBatter = prompt("Wicket! Enter new batter's name:", "Batter " + (state.wickets + 2));
      if (newBatter) {
        state.striker = { name: newBatter, runs: 0, balls: 0 };
        checkAndAddPlayer(newBatter, 'bat');
      }
      
      checkOver();
      saveState();
      renderUI();
    }

    function undoLast() {
      if (state.history.length > 0) {
        state = state.history.pop();
        saveState();
        renderUI();
      } else {
        alert("Nothing left to rewind!");
      }
    }

    function checkOver() {
      if (state.balls > 0 && state.balls % 6 === 0) {
        swapLogic();
        const legends = ["Dennis Lillee", "Shane Warne", "Curtly Ambrose", "Joel Garner", "Malcolm Marshall"];
        const randomLegend = legends[Math.floor(Math.random() * legends.length)];
        const newBowler = prompt("End of Over! Enter next bowler's name:", randomLegend);
        if (newBowler) {
          state.bowler = { name: newBowler, runs: 0, wickets: 0, balls: 0 };
          checkAndAddPlayer(newBowler, 'bowl');
        }
      }
    }

    function promptCustomRun() {
      const r = parseInt(prompt("Enter custom runs (e.g. 7 for overthrows):", "0"));
      if (!isNaN(r)) addRun(r);
    }

    // ==========================================
    // 4. ROSTER & INNINGS LOGIC
    // ==========================================
    function checkAndAddPlayer(name, role) {
      if (!name || name.trim() === "") return;
      if (role === 'bat' && !state.battingRoster.includes(name)) state.battingRoster.push(name);
      if (role === 'bowl' && !state.bowlingRoster.includes(name)) state.bowlingRoster.push(name);
    }

    function addManualPlayer(role) {
      const name = prompt(`Enter ${role === 'bat' ? 'Batter' : 'Bowler'} Name:`);
      if (name) {
        checkAndAddPlayer(name, role);
        saveState();
        renderUI();
      }
    }

    function updateRosterName(role, index, newName, oldName) {
      if (!newName || newName.trim() === "") return;
      
      if (role === 'bat') {
        state.battingRoster[index] = newName;
        if (state.striker.name === oldName) state.striker.name = newName;
        if (state.nonStriker.name === oldName) state.nonStriker.name = newName;
      } else {
        state.bowlingRoster[index] = newName;
        if (state.bowler.name === oldName) state.bowler.name = newName;
      }
      
      saveState();
      renderUI();
    }

    function endInnings() {
      if(!confirm("End the innings? This will swap the teams and set the target score.")) return;
      snapshotHistory();
      
      const tempTeam = state.battingTeamName;
      state.battingTeamName = state.bowlingTeamName;
      state.bowlingTeamName = tempTeam;
      
      const tempRoster = state.battingRoster;
      state.battingRoster = state.bowlingRoster;
      state.bowlingRoster = tempRoster;

      state.target = state.score + 1;
      state.score = 0;
      state.wickets = 0;
      state.balls = 0;
      
      const b1 = prompt("Enter opening Batter 1:", "Batter 1") || "Batter 1";
      const b2 = prompt("Enter opening Batter 2:", "Batter 2") || "Batter 2";
      const bw = prompt("Enter opening Bowler:", "Bowler 1") || "Bowler 1";
      
      state.striker = { name: b1, runs: 0, balls: 0 };
      state.nonStriker = { name: b2, runs: 0, balls: 0 };
      state.bowler = { name: bw, runs: 0, wickets: 0, balls: 0 };
      
      checkAndAddPlayer(b1, 'bat');
      checkAndAddPlayer(b2, 'bat');
      checkAndAddPlayer(bw, 'bowl');

      saveState();
      renderUI();
    }

    function archiveAndReset() {
      if(!confirm("Are you sure you want to permanently archive this match and start fresh?")) return;

      const archiveRef = db.ref('archivedMatches').push();
      archiveRef.set({
        timestamp: new Date().toISOString(),
        matchData: state
      });

      state = {
        score: 0, wickets: 0, balls: 0, target: 0,
        battingTeamName: "Swan Draught Dodgers",
        bowlingTeamName: "Western Weekend Warriors",
        striker: { name: "", runs: 0, balls: 0 },
        nonStriker: { name: "", runs: 0, balls: 0 },
        bowler: { name: "", runs: 0, wickets: 0, balls: 0 },
        battingRoster: [],
        bowlingRoster: [],
        history: []
      };
      
      promptInitialSetup();
      alert("Match archived successfully. Board reset.");
    }

    // ==========================================
    // 5. UI RENDERING & DRAG/DROP
    // ==========================================
    function renderUI() {
      document.getElementById('main-score').innerHTML = `${state.score}<span class="text-3xl text-carlson-charcoal">/${state.wickets}</span>`;
      document.getElementById('main-overs').innerText = `${Math.floor(state.balls / 6)}.${state.balls % 6}`;
      
      const targetEl = document.getElementById('target-display');
      if (state.target > 0) {
        targetEl.classList.remove('hidden');
        document.getElementById('main-target').innerText = state.target;
      } else {
        targetEl.classList.add('hidden');
      }

      document.getElementById('batting-team').value = state.battingTeamName || "Swan Draught Dodgers";
      document.getElementById('bowling-team').value = state.bowlingTeamName || "Western Weekend Warriors";

      document.getElementById('striker-name').value = state.striker.name;
      document.getElementById('striker-runs').innerText = state.striker.runs;
      document.getElementById('striker-balls').innerText = state.striker.balls;
      
      document.getElementById('nonstriker-name').value = state.nonStriker.name;
      document.getElementById('nonstriker-runs').innerText = state.nonStriker.runs;
      document.getElementById('nonstriker-balls').innerText = state.nonStriker.balls;
      
      document.getElementById('bowler-name').value = state.bowler.name;
      document.getElementById('bowler-runs').innerText = state.bowler.runs;
      document.getElementById('bowler-wickets').innerText = state.bowler.wickets;
      document.getElementById('bowler-overs').innerText = `${Math.floor(state.bowler.balls / 6)}.${state.bowler.balls % 6}`;

      document.getElementById('batting-roster-list').innerHTML = (state.battingRoster || []).map((p, index) => 
        `<input type="text" class="w-full bg-transparent font-bold border-b border-dashed border-carlson-gray3 focus:outline-none truncate" value="${p}" onchange="updateRosterName('bat', ${index}, this.value, '${p}')">`
      ).join('');
      
      document.getElementById('bowling-roster-list').innerHTML = (state.bowlingRoster || []).map((p, index) => 
        `<input type="text" class="w-full bg-transparent font-bold border-b border-dashed border-carlson-gray3 focus:outline-none truncate" value="${p}" onchange="updateRosterName('bowl', ${index}, this.value, '${p}')">`
      ).join('');
    }

    document.addEventListener("DOMContentLoaded", () => {
      const container = document.getElementById('app-container');
      const savedOrder = JSON.parse(localStorage.getItem('layoutOrder'));
      
      if (savedOrder) {
        savedOrder.forEach(id => {
          const el = document.querySelector(`[data-id="${id}"]`);
          if (el) container.appendChild(el);
        });
      }

      Sortable.create(container, {
        handle: '.drag-handle',
        animation: 150,
        onEnd: function () {
          const order = Array.from(container.children).map(el => el.getAttribute('data-id'));
          localStorage.setItem('layoutOrder', JSON.stringify(order));
        }
      });
      
      renderUI();
    });

    ['batting-team', 'bowling-team', 'striker-name', 'nonstriker-name', 'bowler-name'].forEach(id => {
      document.getElementById(id).addEventListener('change', (e) => {
        const val = e.target.value.trim();
        if (!val) return;

        if (id === 'batting-team') { state.battingTeamName = val; saveState(); renderUI(); return; }
        if (id === 'bowling-team') { state.bowlingTeamName = val; saveState(); renderUI(); return; }

        let oldName = "";
        let role = 'bat';
        
        if (id === 'striker-name') { oldName = state.striker.name; state.striker.name = val; }
        if (id === 'nonstriker-name') { oldName = state.nonStriker.name; state.nonStriker.name = val; }
        if (id === 'bowler-name') { oldName = state.bowler.name; state.bowler.name = val; role = 'bowl'; }
        
        let roster = role === 'bat' ? state.battingRoster : state.bowlingRoster;
        const index = roster.indexOf(oldName);
        if (index !== -1) {
          roster[index] = val; 
        } else {
          checkAndAddPlayer(val, role); 
        }
        
        saveState();
        renderUI();
      });
    });

    function toggleScorecard() {
      alert("Scorecard summary:\n" + state.score + "/" + state.wickets + " (" + Math.floor(state.balls / 6) + "." + (state.balls % 6) + " Overs)");
    }
  </script>
</body>
</html>
